[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=runtime/pytest"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]

"experiments/*.py" = ["E402"]
